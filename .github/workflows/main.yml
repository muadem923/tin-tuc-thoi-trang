name: Bot Cap Nhat Tin Tuc
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['bot_news.py', '.github/workflows/main.yml']
permissions:
  contents: write
concurrency:
  group: news-data-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'feedparser>=6,<7' 'requests>=2.32,<3'
      - name: Fetch relevant news safely
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_news.py
      - name: Save validated data
        run: |
          python -m json.tool news_data.json > /dev/null
          git config user.name 'GitHub Bot'
          git config user.email 'bot@github.com'
          git add news_data.json
          if git diff --cached --quiet; then
            echo 'No news changes'
          else
            git commit -m 'Update relevant fashion news'
            git push
          fi
